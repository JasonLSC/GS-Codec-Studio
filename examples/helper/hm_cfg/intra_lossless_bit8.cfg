# --- 1. Core Lossless Settings ---
CostMode                     : lossless              # Critical! Instructs encoder to operate in lossless mode
TransquantBypassEnableFlag   : 1                     # Enable transform-quantization bypass
CUTransquantBypassFlagForce  : 1                     # Force all coding units to use transform-quantization bypass
QP                           : 4                     # Standard QP value for lossless coding, ensures no quantization loss

#======== Unit definition ================
MaxCUWidth                    : 64          # Maximum coding unit width in pixel
MaxCUHeight                   : 64          # Maximum coding unit height in pixel
MaxPartitionDepth             : 4           # Maximum coding unit depth
QuadtreeTULog2MaxSize         : 5           # Log2 of maximum transform size for
                                            # quadtree-based TU coding (2...6)
QuadtreeTULog2MinSize         : 2           # Log2 of minimum transform size for
                                            # quadtree-based TU coding (2...6)
QuadtreeTUMaxDepthInter       : 3
QuadtreeTUMaxDepthIntra       : 3

# --- 2. Precision Settings ---
# For 8-bit or 10-bit input, recommended to set internal bit depth to 10 or higher for better computation precision.
# For lossless, internal precision typically needs to be >= input precision, used with ExtendedPrecision.
InputBitDepth                : 8                     # Input luma component bit depth (set according to your YUV file)
InputBitDepthC               : 8                     # Input chroma component bit depth (set according to your YUV file)
# InternalBitDepth             : 10                    # Internal luma processing bit depth, recommend 10 or 12
# InternalBitDepthC            : 10                    # Internal chroma processing bit depth, recommend 10 or 12
OutputBitDepth               : 8                     # Output reconstructed YUV luma bit depth (usually same as input)
OutputBitDepthC              : 8                     # Output reconstructed YUV chroma bit depth (usually same as input)
ExtendedPrecision            : 0                     # Enable extended precision internal calculations to reduce rounding errors

# --- 3. Color Format and Profile ---
# For YUV444p lossless, RExt Profile is typically required.
InputChromaFormat            : 444                   # Input chroma sampling format (e.g. YUV444p)
ChromaFormatIDC              : 444                   # Chroma sampling format in output bitstream
Profile                      : main-RExt             # Select profile supporting 4:4:4 and higher bit depths
Level                        : 6.2                   # Choose appropriate level based on resolution and frame rate

# --- 4. Disable Tools That May Affect Lossless ---
# Ensure intra prediction tools don't introduce approximations or smoothing.
IntraReferenceSmoothing      : 0                     # Disable intra reference smoothing for exact prediction

# --- 5. GOP Structure (Example) ---
# Lossless coding typically prefers All-Intra mode to simplify implementation and avoid inter-frame dependencies.
# Setting IntraPeriod to 1 makes all frames I-frames.
IntraPeriod                  : 1                     # Every frame is an I-frame (All-Intra coding)
GOPSize                      : 1                     # GOP size of 1